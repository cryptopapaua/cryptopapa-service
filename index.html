.fi:focus,.fsel:focus{outline:2px solid var(--acc);outline-offset:-1px}

.irow .fi.t{flex:2;min-width:150px}.irow .fsel.ty{flex:1;min-width:130px;width:auto}.irow .fi.q{width:64px;text-align:center}
.irow .rm{background:#f2f4f7;border:0;border-radius:10px;width:42px;cursor:pointer;font-size:15px}
.addrow{margin-top:10px;background:#fff;border:1.5px dashed #c9cfd9;color:var(--mut);width:100%;padding:11px;border-radius:12px;font-size:14px}
.sheet .actions{display:flex;gap:10px;margin-top:20px}
.sheet .actions .btn{flex:1;padding:13px}

.empty .big{font-size:40px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}

.lcard .coin{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#F7931A,#ffb949);display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;margin:0 auto 14px;box-shadow:0 6px 18px rgba(247,147,26,.4)}
.lcard h1{font-size:20px;text-align:center;letter-spacing:-.3px}
.lcard p{text-align:center;color:var(--mut);font-size:13.5px;margin:6px 0 18px}
.lerr{background:#fde9e7;color:var(--red);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px;display:none}
.lcard .btn-acc{width:100%;margin-top:16px;padding:14px}
.skel{color:var(--mut);text-align:center;padding:60px 0}
</style>

<body>
<div id="root"><div class="skel">Загрузка…</div></div>
<div id="toast"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
var sb = createClient('https://diqyawhufjckcoftrdzv.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpcXlhd2h1Zmpja2NvZnRyZHp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNzQxMTgsImV4cCI6MjEwMTg1MDExOH0._h8DqZOIsn00GqEJ4W7q2a7FLEzc-oqU2AkXEmIHETE');

var STAGES=[
 {k:'received',l:'Принято',i:'📦',c:'st-grey'},
 {k:'diagnostics',l:'Диагностика',i:'🔍',c:'st-blue'},
 {k:'repair',l:'В ремонте',i:'🔧',c:'st-orange'},
 {k:'waiting_parts',l:'Ждёт запчасти',i:'⏳',c:'st-purple'},
 {k:'done',l:'Готово',i:'✅',c:'st-green'},
 {k:'shipped',l:'Отправлено',i:'🚚',c:'st-teal'},
 {k:'scrap',l:'Не подлежит ремонту',i:'⛔',c:'st-red'}
];
var RANK={received:0,diagnostics:1,waiting_parts:2,repair:3,scrap:4,done:4,shipped:5};
var DEFECTS=['КЗ','Перегрев','Брак','Не видит чипы','Плавающая','Механика'];
function sm(k){for(var j=0;j<STAGES.length;j++){if(STAGES[j].k===k)return STAGES[j];}return STAGES[0];}

// S.edit: буферы незасохранённых правок: 'b<id>' — плата, 'i<id>' — позиция без плат
var S={profile:null,requests:[],items:[],boards:[],comments:[],clients:[],filter:'all',search:'',expanded:{},confirmDel:{},confirmDelB:{},edit:{},np:{}};
var root=document.getElementById('root');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},2200);}
function fdate(x){try{return new Date(x).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});}catch(e){return '';}}
function fdt(x){try{return new Date(x).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+new Date(x).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}

function reqItems(id){return S.items.filter(function(i){return i.request_id===id;});}
function itemBoards(id){return S.boards.filter(function(b){return b.item_id===id;});}
function reqComments(id){return S.comments.filter(function(c){return c.request_id===id;});}
function clientOf(r){for(var j=0;j<S.clients.length;j++){if(S.clients[j].id===r.client_id)return S.clients[j];}return null;}

function effStage(it){
 var bs=itemBoards(it.id);if(!bs.length)return it.stage;
 var min=null;bs.forEach(function(b){var r=RANK[b.stage]!==undefined?RANK[b.stage]:0;if(min===null||r<min.r)min={r:r,s:b.stage};});
 return min.s;
}
function reqStatus(r){var its=reqItems(r.id);if(!its.length)return 'received';
 var st=its.map(effStage);
 if(st.every(function(s){return s==='shipped';}))return 'shipped';
 if(st.every(function(s){return s==='done'||s==='shipped'||s==='scrap';}))return 'done';
 if(st.some(function(s){return s!=='received';}))return 'work';
 return 'received';}
var STATP={received:{l:'Принято',c:'p-grey'},work:{l:'В работе',c:'p-orange'},done:{l:'Готово',c:'p-green'},shipped:{l:'Отправлено',c:'p-teal'}};
function reqTitle(r){return r.number?('Заявка #'+r.number):'Заявка (без №)';}

// ---------- ЗАГРУЗКА ДАННЫХ ----------
async function loadData(){
 var res=await Promise.all([
  sb.from('requests').select('*').order('created_at',{ascending:false}),
  sb.from('items').select('*').order('id'),
  sb.from('boards').select('*').order('id'),
  sb.from('comments').select('*').order('created_at')
 ]);
 S.requests=res[0].data||[];S.items=res[1].data||[];S.boards=res[2].data||[];S.comments=res[3].data||[];
 if(S.profile&&S.profile.role==='owner'){var rc=await sb.from('clients').select('*').order('name');S.clients=rc.data||[];}
 // если открыто редактирование или человек печатает — не перерисовываем, чтобы не потерять правки
 if(Object.keys(S.edit).length)return;
 var ae=document.activeElement;
 var list=document.getElementById('list');
 if(ae&&list&&list.contains(ae)&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
 renderList();
}

// ---------- СТАТУСЫ НОВОЙ ПОЧТЫ ----------
function npCls(code){
 if(code==='9')return 'np-g';
 if(code==='7'||code==='8'||code==='10')return 'np-o';
 if(code==='4'||code==='5'||code==='6'||code==='41'||code==='101')return 'np-b';
 if(code==='102'||code==='103'||code==='104'||code==='105'||code==='106')return 'np-r';
 return 'np-x';
}
function npIcon(code){
 if(code==='9')return '✅';
 if(code==='7'||code==='8'||code==='10')return '📍';
 if(code==='4'||code==='5'||code==='6'||code==='41'||code==='101')return '🚚';
 if(code==='102'||code==='103'||code==='104'||code==='105'||code==='106')return '↩️';
 return '🕓';
}
async function fetchNp(){
 var ttns=[];S.requests.forEach(function(r){if(r.ttn&&ttns.indexOf(r.ttn)<0)ttns.push(r.ttn);});
 if(!ttns.length)return;
 try{
  var r=await sb.functions.invoke('np-track',{body:{ttns:ttns}});
  if(r.data&&r.data.statuses){
   S.np=r.data.statuses;
   if(Object.keys(S.edit).length)return;
   var ae=document.activeElement;var list=document.getElementById('list');
   if(ae&&list&&list.contains(ae)&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
   renderList();
  }
 }catch(e){}
}

// ---------- ЭКРАН ВХОДА ----------
function renderLogin(){
 root.innerHTML='<div class="login"><div class="lcard">'+
 '<div class="coin">₿</div><h1>CRYPTOPAPA Сервис</h1>'+
 '<p>Учёт ремонта майнинг-оборудования</p>'+
 '<label class="fl">Логин (email)</label><input class="fi" id="lemail" type="email" autocomplete="username" placeholder="email">'+
 '<label class="fl">Пароль</label><input class="fi" id="lpass" type="password" autocomplete="current-password" placeholder="••••••••">'+
 '<div class="lerr" id="lerr"></div>'+
 '<button class="btn btn-acc" id="lbtn">Войти</button>'+
 '</div></div>';
 var go=async function(){
  var b=document.getElementById('lbtn');b.disabled=true;b.textContent='Входим…';
  var r=await sb.auth.signInWithPassword({email:document.getElementById('lemail').value.trim(),password:document.getElementById('lpass').value});
  if(r.error){var e=document.getElementById('lerr');e.style.display='block';e.textContent='Неверный логин или пароль';b.disabled=false;b.textContent='Войти';}
  else{start();}
 };
 document.getElementById('lbtn').addEventListener('click',go);
 document.getElementById('lpass').addEventListener('keydown',function(ev){if(ev.key==='Enter')go();});
}

// ---------- ОСНОВНОЙ ЭКРАН ----------
function renderShell(){
 var isOwner=S.profile.role==='owner';
 root.innerHTML='<header><div class="hin">'+
 '<div class="logo"><div class="coin">₿</div><div>CRYPTOPAPA <small>сервис-учёт</small></div></div>'+
 '<div class="spacer"></div>'+
 '<div class="who">'+esc(S.profile.display_name)+'<br>'+(isOwner?'владелец':'мастер')+'</div>'+
 '<button class="btn btn-ghost" id="outbtn" title="Выйти">Выйти</button>'+
 '</div></header>'+
 '<div class="wrap">'+
 '<div class="chips" id="chips"></div>'+
 '<input class="search" id="srch" type="search" placeholder="🔍 Поиск: №, ТТН, оборудование'+(isOwner?', клиент':'')+'">'+
 '<div id="list"></div>'+
 '</div>'+
 (isOwner?'<button class="btn btn-acc fab" id="newbtn">＋ Новая заявка</button>':'')+
 '<div id="modal"></div>';
 document.getElementById('outbtn').addEventListener('click',async function(){await sb.auth.signOut();location.reload();});
 document.getElementById('srch').addEventListener('input',function(e){S.search=e.target.value;renderList();});
 if(isOwner)document.getElementById('newbtn').addEventListener('click',openNew);
 renderList();
}

function renderChips(){
 var counts={all:S.requests.length,work:0,done:0,shipped:0};
 S.requests.forEach(function(r){var st=reqStatus(r);if(st==='done')counts.done++;else if(st==='shipped')counts.shipped++;else counts.work++;});
 var defs=[['all','Все'],['work','В работе'],['done','Готово'],['shipped','Отправлено']];
 var h='';
 defs.forEach(function(d){h+='<button class="chip'+(S.filter===d[0]?' on':'')+'" data-f="'+d[0]+'">'+d[1]+' <b>'+counts[d[0]]+'</b></button>';});
 var el=document.getElementById('chips');el.innerHTML=h;
 el.querySelectorAll('.chip').forEach(function(b){b.addEventListener('click',function(){S.filter=b.getAttribute('data-f');renderList();});});
}

function visibleRequests(){
 var q=S.search.trim().toLowerCase();
 return S.requests.filter(function(r){
  var st=reqStatus(r);
  if(S.filter==='work'&&(st==='done'||st==='shipped'))return false;
  if(S.filter==='done'&&st!=='done')return false;
  if(S.filter==='shipped'&&st!=='shipped')return false;
  if(!q)return true;
  var hay=(r.number?('#'+r.number+' '+r.number):'')+' '+(r.ttn||'')+' '+(r.note||'');
  reqItems(r.id).forEach(function(i){hay+=' '+i.title;});
  var cl=clientOf(r);if(cl)hay+=' '+cl.name;
  return hay.toLowerCase().indexOf(q)>=0;
 });
}

// перед любой перерисовкой забираем напечатанное в буферы, чтобы ничего не пропало
function captureInputs(){
 var list=document.getElementById('list');if(!list)return;
 list.querySelectorAll('.best').forEach(function(inp){var e=S.edit['b'+inp.getAttribute('data-board')];if(e)e.est_chips=inp.value;});
 list.querySelectorAll('.bfact').forEach(function(inp){var e=S.edit['b'+inp.getAttribute('data-board')];if(e)e.fact_chips=inp.value;});
 list.querySelectorAll('.bnote').forEach(function(inp){var e=S.edit['b'+inp.getAttribute('data-board')];if(e)e.note=inp.value;});
}

function stageSelect(cls,attr,id,cur){
 var m=sm(cur);
 var h='<select class="stagesel '+m.c+' '+cls+'" '+attr+'="'+id+'">';
 STAGES.forEach(function(s){h+='<option value="'+s.k+'"'+(s.k===cur?' selected':'')+'>'+s.i+' '+s.l+'</option>';});
 return h+'</select>';
}

function boardHtml(b,isOwner){
 var e=S.edit['b'+b.id];
 var h='';
 if(!e){
  // режим просмотра
  var m=sm(b.stage);
  h+='<div class="board">';
  h+='<div class="brow"><span class="blabel">🟩 '+esc(b.label)+'</span><span class="stpill '+m.c+'">'+m.i+' '+m.l+'</span>'+
   '<button class="ebtn" data-eb="'+b.id+'">✏️ Изменить</button></div>';
  var facts='';
  (b.defects||[]).forEach(function(d){facts+='<span class="defro">⚠ '+esc(d)+'</span>';});
  if(b.est_chips)facts+='<span>Чипов предв.: <b>'+esc(b.est_chips)+'</b></span>';
  if(b.fact_chips!=null)facts+='<span>Заменено: <b>'+b.fact_chips+' шт</b></span>';
  if(facts)h+='<div class="bview">'+facts+'</div>';
  if(b.note)h+='<div class="bview"><span class="bnoteview">📝 '+esc(b.note)+'</span></div>';
  h+='</div>';
 }else{
  // режим редактирования
  h+='<div class="board editing">';
  h+='<div class="brow"><span class="blabel">🟩 '+esc(b.label)+'</span>'+stageSelect('bstage','data-board',b.id,e.stage)+'</div>';
  h+='<div class="defrow"><span class="deflab">Дефекты</span>';
  DEFECTS.forEach(function(d){
   var on=(e.defects||[]).indexOf(d)>=0;
   h+='<button class="defbtn'+(on?' on':'')+'" data-def="'+esc(d)+'" data-board="'+b.id+'">'+(on?'⚠ ':'')+esc(d)+'</button>';
  });
  h+='</div>';
  h+='<div class="chiprow">'+
   '<label class="chipfield">ЧИПОВ ПРЕДВАРИТЕЛЬНО<input class="chipin best" data-board="'+b.id+'" placeholder="напр. 5–10" value="'+esc(e.est_chips||'')+'"></label>'+
   '<label class="chipfield">ЗАМЕНЕНО ФАКТИЧЕСКИ<input class="chipin bfact" data-board="'+b.id+'" type="number" min="0" placeholder="—" value="'+esc(e.fact_chips==null?'':e.fact_chips)+'"></label>'+
  '</div>';
  h+='<input class="bnote" data-board="'+b.id+'" placeholder="Заметка по плате…" value="'+esc(e.note||'')+'">';
  h+='<div class="editactions"><button class="btn sbtn" data-sb="'+b.id+'">💾 Сохранить</button><button class="btn cbtn" data-cb="'+b.id+'">Отмена</button><span class="spacer"></span>';
  if(isOwner)h+='<button class="bdel'+(S.confirmDelB[b.id]?' arm':'')+'" data-delboard="'+b.id+'">'+(S.confirmDelB[b.id]?'удалить плату?':'✕ удалить')+'</button>';
  h+='</div></div>';
 }
 return h;
}

function renderList(){
 captureInputs();
 renderChips();
 var isOwner=S.profile.role==='owner';
 var rs=visibleRequests();
 if(!rs.length){document.getElementById('list').innerHTML='<div class="empty"><div class="big">📭</div>Заявок нет</div>';return;}
 var h='';
 rs.forEach(function(r){
  var st=STATP[reqStatus(r)];var its=reqItems(r.id);var cms=reqComments(r.id);var open=!!S.expanded[r.id];var cl=clientOf(r);
  h+='<div class="card">';
  h+='<div class="chead" data-open="'+r.id+'"><div class="row1">'+
   '<span class="rnum">'+reqTitle(r)+'</span>'+
   '<span class="pill '+st.c+'">'+st.l+'</span>'+
   '<span class="spacer"></span><span style="color:var(--mut);font-size:12px">'+fdate(r.created_at)+' '+(open?'▲':'▼')+'</span></div>';
  h+='<div class="row2">';
  if(r.ttn)h+='<span class="ttn">📦 '+esc(r.ttn)+' <button class="copybtn" data-copy="'+esc(r.ttn)+'" title="Скопировать ТТН">⧉</button></span>';
  if(r.ttn&&S.np[r.ttn]){var np=S.np[r.ttn];h+='<span class="npline"><span class="npbadge">НП</span><span class="'+npCls(np.code)+'">'+npIcon(np.code)+' '+esc(np.status)+'</span></span>';}
  if(isOwner&&cl)h+='<span>👤 <span class="cln">'+esc(cl.name)+'</span></span>';
  if(cms.length)h+='<span>💬 '+cms.length+'</span>';
  h+='</div>';
  if(!open){h+='<div class="itemsum">';its.forEach(function(i){
   var m=sm(effStage(i));var bs=itemBoards(i.id);
   var extra='';
   if(bs.length>1){var dn=bs.filter(function(b){return b.stage==='done'||b.stage==='shipped';}).length;extra=' · ✅'+dn+'/'+bs.length;}
   h+='<span class="isum">'+m.i+' '+esc(i.title)+(i.qty>1?' ×'+i.qty:'')+extra+'</span>';
  });h+='</div>';}
  h+='</div>';
  if(open){
   h+='<div class="cbody">';
   h+='<div class="sect">Оборудование и стадии</div>';
   its.forEach(function(i){
    var bs=itemBoards(i.id);
    var ie=S.edit['i'+i.id];
    h+='<div class="item"><div class="itop"><div class="ititle">'+esc(i.title)+(i.qty>1?' <small>×'+i.qty+'</small>':'')+'</div>';
    if(bs.length){var m=sm(effStage(i));h+='<span class="stpill '+m.c+'">'+m.i+' '+m.l+'</span>';}
    else if(ie){h+=stageSelect('istage','data-item',i.id,ie.stage);}
    else{var mi=sm(i.stage);h+='<span class="stpill '+mi.c+'">'+mi.i+' '+mi.l+'</span><button class="ebtn" data-ei="'+i.id+'">✏️ Изменить</button>';}
    h+='</div>';
    if(!bs.length&&ie)h+='<div class="editactions"><button class="btn sbtn" data-si="'+i.id+'">💾 Сохранить</button><button class="btn cbtn" data-ci="'+i.id+'">Отмена</button></div>';
    bs.forEach(function(b){h+=boardHtml(b,isOwner);});
    if(isOwner&&bs.length)h+='<button class="addboard" data-additem="'+i.id+'">＋ добавить плату</button>';
    h+='</div>';
   });
   if(r.note)h+='<div class="note">📌 '+esc(r.note)+'</div>';
   h+='<div class="sect">Комментарии</div>';
   if(!cms.length)h+='<div style="font-size:13px;color:var(--mut)">Пока нет комментариев</div>';
   cms.forEach(function(c){
    h+='<div class="cmt"><div class="m"><b>'+esc(c.author_name)+'</b><span class="tagr'+(c.author_role==='partner'?' tagp':'')+'">'+(c.author_role==='partner'?'мастер':'владелец')+'</span><span>'+fdt(c.created_at)+'</span></div><div class="b">'+esc(c.body)+'</div></div>';
   });
   h+='<div class="cform"><textarea id="cmt-'+r.id+'" placeholder="Написать комментарий…"></textarea><button class="btn" data-send="'+r.id+'">➤</button></div>';
   if(isOwner){
    h+='<div class="danger">'+(S.confirmDel[r.id]?'<button class="btn delconf" data-del="'+r.id+'">Точно удалить заявку?</button>':'<button class="dellink" data-del="'+r.id+'">удалить заявку</button>')+'</div>';
   }
   h+='</div>';
  }
  h+='</div>';
 });
 var list=document.getElementById('list');list.innerHTML=h;

 list.querySelectorAll('[data-open]').forEach(function(el){el.addEventListener('click',function(ev){
  if(ev.target.closest('.copybtn'))return;
  var id=+el.getAttribute('data-open');S.expanded[id]=!S.expanded[id];delete S.confirmDel[id];S.confirmDelB={};renderList();
 });});
 list.querySelectorAll('.copybtn').forEach(function(b){b.addEventListener('click',function(){
  navigator.clipboard.writeText(b.getAttribute('data-copy')).then(function(){toast('ТТН скопирован ✓');});
 });});

 // ✏️ Изменить: плата
 list.querySelectorAll('[data-eb]').forEach(function(btn){btn.addEventListener('click',function(){
  var id=+btn.getAttribute('data-eb');
  var b=S.boards.find(function(x){return x.id===id;});if(!b)return;
  S.edit['b'+id]={stage:b.stage,defects:(b.defects||[]).slice(),est_chips:b.est_chips||'',fact_chips:b.fact_chips==null?'':String(b.fact_chips),note:b.note||''};
  renderList();
 });});
 // ✏️ Изменить: позиция без плат
 list.querySelectorAll('[data-ei]').forEach(function(btn){btn.addEventListener('click',function(){
  var id=+btn.getAttribute('data-ei');
  var it=S.items.find(function(x){return x.id===id;});if(!it)return;
  S.edit['i'+id]={stage:it.stage};
  renderList();
 });});
 // выбор стадии в режиме редактирования — только в буфер
 list.querySelectorAll('.bstage').forEach(function(sel){sel.addEventListener('change',function(){
  var e=S.edit['b'+sel.getAttribute('data-board')];if(e){e.stage=sel.value;renderList();}
 });});
 list.querySelectorAll('.istage').forEach(function(sel){sel.addEventListener('change',function(){
  var e=S.edit['i'+sel.getAttribute('data-item')];if(e){e.stage=sel.value;renderList();}
 });});
 // дефекты — только в буфер
 list.querySelectorAll('.defbtn').forEach(function(btn){btn.addEventListener('click',function(){
  var e=S.edit['b'+btn.getAttribute('data-board')];if(!e)return;
  var d=btn.getAttribute('data-def');var ix=e.defects.indexOf(d);
  if(ix>=0)e.defects.splice(ix,1);else e.defects.push(d);
  renderList();
 });});
 // 💾 Сохранить плату
 list.querySelectorAll('[data-sb]').forEach(function(btn){btn.addEventListener('click',async function(){
  captureInputs();
  var id=+btn.getAttribute('data-sb');var e=S.edit['b'+id];if(!e)return;
  btn.disabled=true;btn.textContent='Сохраняем…';
  var patch={
   stage:e.stage,
   defects:e.defects,
   est_chips:(e.est_chips||'').trim()||null,
   fact_chips:(String(e.fact_chips||'').trim()==='')?null:+e.fact_chips,
   note:(e.note||'').trim()||null,
   updated_at:new Date().toISOString()
  };
  var r=await sb.from('boards').update(patch).eq('id',id);
  if(r.error){toast('Ошибка сохранения');btn.disabled=false;btn.textContent='💾 Сохранить';return;}
  var b=S.boards.find(function(x){return x.id===id;});
  if(b){b.stage=patch.stage;b.defects=patch.defects;b.est_chips=patch.est_chips;b.fact_chips=patch.fact_chips;b.note=patch.note;}
  delete S.edit['b'+id];renderList();toast('Сохранено ✓');
 });});
 // 💾 Сохранить позицию
 list.querySelectorAll('[data-si]').forEach(function(btn){btn.addEventListener('click',async function(){
  var id=+btn.getAttribute('data-si');var e=S.edit['i'+id];if(!e)return;
  btn.disabled=true;btn.textContent='Сохраняем…';
  var r=await sb.from('items').update({stage:e.stage,updated_at:new Date().toISOString()}).eq('id',id);
  if(r.error){toast('Ошибка сохранения');btn.disabled=false;btn.textContent='💾 Сохранить';return;}
  var it=S.items.find(function(x){return x.id===id;});if(it)it.stage=e.stage;
  delete S.edit['i'+id];renderList();toast('Сохранено ✓');
 });});
 // Отмена
 list.querySelectorAll('[data-cb]').forEach(function(btn){btn.addEventListener('click',function(){
  delete S.edit['b'+btn.getAttribute('data-cb')];delete S.confirmDelB[+btn.getAttribute('data-cb')];renderList();
 });});
 list.querySelectorAll('[data-ci]').forEach(function(btn){btn.addEventListener('click',function(){
  delete S.edit['i'+btn.getAttribute('data-ci')];renderList();
 });});
 // добавить плату (владелец)
 list.querySelectorAll('[data-additem]').forEach(function(btn){btn.addEventListener('click',async function(){
  var itemId=+btn.getAttribute('data-additem');
  var n=itemBoards(itemId).length+1;
  var r=await sb.from('boards').insert({item_id:itemId,label:'Плата '+n});
  if(r.error){toast('Ошибка');}else{
   var res=await sb.from('boards').select('*').order('id');S.boards=res.data||S.boards;
   renderList();toast('Плата добавлена');
  }
 });});
 // удалить плату (владелец, два клика)
 list.querySelectorAll('[data-delboard]').forEach(function(btn){btn.addEventListener('click',async function(){
  var id=+btn.getAttribute('data-delboard');
  if(!S.confirmDelB[id]){S.confirmDelB={};S.confirmDelB[id]=true;renderList();return;}
  var r=await sb.from('boards').delete().eq('id',id);
  if(r.error){toast('Ошибка удаления');}else{
   delete S.confirmDelB[id];delete S.edit['b'+id];
   S.boards=S.boards.filter(function(b){return b.id!==id;});
   renderList();toast('Плата удалена');
  }
 });});
 list.querySelectorAll('[data-send]').forEach(function(b){b.addEventListener('click',async function(){
  var id=+b.getAttribute('data-send');var ta=document.getElementById('cmt-'+id);var txt=ta.value.trim();
  if(!txt)return;b.disabled=true;
  var r=await sb.from('comments').insert({request_id:id,author_id:S.uid,author_name:S.profile.display_name,author_role:S.profile.role,body:txt});
  if(r.error){toast('Ошибка отправки');b.disabled=false;}else{
   var res=await sb.from('comments').select('*').order('created_at');S.comments=res.data||S.comments;
   renderList();toast('Комментарий добавлен ✓');
  }
 });});
 list.querySelectorAll('[data-del]').forEach(function(b){b.addEventListener('click',async function(){
  var id=+b.getAttribute('data-del');
  if(!S.confirmDel[id]){S.confirmDel[id]=true;renderList();return;}
  var r=await sb.from('requests').delete().eq('id',id);
  if(r.error){toast('Ошибка удаления');}else{delete S.confirmDel[id];delete S.expanded[id];await loadData();renderList();toast('Заявка удалена');}
 });});
}

// ---------- НОВАЯ ЗАЯВКА ----------
function openNew(){
 var m=document.getElementById('modal');
 var copts='<option value="">— выбрать —</option>';
 S.clients.forEach(function(c){copts+='<option value="'+c.id+'">'+esc(c.name)+'</option>';});
 copts+='<option value="__new">➕ Новый клиент…</option>';
 m.innerHTML='<div class="overlay" id="ovl"><div class="sheet">'+
 '<h2>🚀 Новая заявка</h2>'+
 '<label class="fl">№ заявки (необязательно)</label><input class="fi" id="f-num" type="number" placeholder="например 292">'+
 '<label class="fl">ТТН Новой почты</label><input class="fi" id="f-ttn" inputmode="numeric" placeholder="59001234567890">'+
 '<label class="fl">Клиент (мастер его не увидит)</label><select class="fsel" id="f-cl">'+copts+'</select>'+
 '<input class="fi" id="f-clnew" style="display:none;margin-top:8px" placeholder="@telegram или телефон">'+
 '<label class="fl">Оборудование</label><div id="f-items"></div>'+
 '<button class="btn addrow" id="f-add">＋ добавить позицию</button>'+
 '<label class="fl">Примечание для мастера (необязательно)</label><textarea class="fi" id="f-note" rows="2" placeholder="например: чипы клиента, вернуть остаток"></textarea>'+
 '<div class="actions"><button class="btn btn-ghost" id="f-cancel">Отмена</button><button class="btn btn-acc" id="f-save">Создать заявку</button></div>'+
 '</div></div>';
 function addRow(){var d=document.createElement('div');d.className='irow';
  d.innerHTML='<input class="fi t" placeholder="Хеш-плата S21 Pro">'+
   '<select class="fsel ty"><option value="board">Хеш-плата</option><option value="asic">Целый асик · 3 платы</option><option value="other">Другое (чипы и т.п.)</option></select>'+
   '<input class="fi q" type="number" value="1" min="1"><button class="rm" title="Убрать">✕</button>';
  d.querySelector('.rm').addEventListener('click',function(){d.remove();});
  document.getElementById('f-items').appendChild(d);}
 addRow();
 document.getElementById('f-add').addEventListener('click',addRow);
 document.getElementById('f-cl').addEventListener('change',function(e){document.getElementById('f-clnew').style.display=(e.target.value==='__new')?'block':'none';});
 function close(){m.innerHTML='';}
 document.getElementById('f-cancel').addEventListener('click',close);
 document.getElementById('ovl').addEventListener('click',function(e){if(e.target.id==='ovl')close();});
 document.getElementById('f-save').addEventListener('click',async function(){
  var btn=this;var rows=[];
  document.querySelectorAll('#f-items .irow').forEach(function(d){
   var t=d.querySelector('.t').value.trim();var q=+d.querySelector('.q').value||1;var ty=d.querySelector('.ty').value;
   if(t)rows.push({title:t,qty:q,type:ty});
  });
  if(!rows.length){toast('Добавьте хотя бы одну позицию');return;}
  btn.disabled=true;btn.textContent='Сохраняем…';
  var clientId=null;var cv=document.getElementById('f-cl').value;
  if(cv==='__new'){var nn=document.getElementById('f-clnew').value.trim();
   if(nn){var rc=await sb.from('clients').insert({name:nn}).select().single();if(rc.data)clientId=rc.data.id;}
  }else if(cv){clientId=+cv;}
  var num=document.getElementById('f-num').value?+document.getElementById('f-num').value:null;
  var ttn=document.getElementById('f-ttn').value.trim()||null;
  var note=document.getElementById('f-note').value.trim()||null;
  var rr=await sb.from('requests').insert({number:num,ttn:ttn,client_id:clientId,note:note}).select().single();
  if(rr.error||!rr.data){toast('Ошибка создания');btn.disabled=false;btn.textContent='Создать заявку';return;}
  var its=rows.map(function(x){return {request_id:rr.data.id,title:x.title,qty:x.qty};});
  var ri=await sb.from('items').insert(its).select();
  if(ri.data){
   var bs=[];
   ri.data.forEach(function(item,ix){
    var t=rows[ix]?rows[ix].type:'other';
    if(t==='asic'){for(var k=1;k<=3;k++)bs.push({item_id:item.id,label:'Плата '+k});}
    else if(t==='board'){var n=rows[ix].qty||1;for(var k2=1;k2<=n;k2++)bs.push({item_id:item.id,label:n>1?('Плата '+k2):'Плата 1'});}
   });
   if(bs.length)await sb.from('boards').insert(bs);
  }
  close();S.expanded[rr.data.id]=true;await loadData();renderList();toast('Заявка создана 🚀');
 });
}

// ---------- СТАРТ ----------
async function start(){
 var s=await sb.auth.getSession();
 if(!s.data.session){renderLogin();return;}
 S.uid=s.data.session.user.id;
 var p=await sb.from('profiles').select('*').eq('user_id',S.uid).single();
 if(!p.data){await sb.auth.signOut();renderLogin();return;}
 S.profile=p.data;
 renderShell();
 await loadData();
 fetchNp();
 setInterval(fetchNp,300000);
 sb.channel('crm').on('postgres_changes',{event:'*',schema:'public'},function(){
  clearTimeout(S._rt);S._rt=setTimeout(loadData,400);
 }).subscribe();
}
start();
</script>
